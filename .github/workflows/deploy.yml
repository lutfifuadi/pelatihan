name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "[1] Maintenance mode ON..."
            php artisan down --retry=60

            echo "[2] Pull kode terbaru..."
            git pull origin main

            echo "[3] Update Composer..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "[4] Build frontend..."
            (npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund) && npm run build

            echo "[5] Migrasi database..."
            php artisan migrate --force

            echo "[6] Storage link..."
            [ ! -L public/storage ] && php artisan storage:link || true

            echo "[7] Optimasi..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "[8] Permission..."
            chmod -R 775 storage bootstrap/cache
            chown -R ${{ secrets.DEPLOY_USER || 'www' }}:${{ secrets.DEPLOY_USER || 'www' }} . 2>/dev/null || echo "[INFO] chown dilewati (butuh sudo)"

            echo "[9] Maintenance mode OFF..."
            php artisan up

            echo "✅ Deploy selesai: $(date)"
