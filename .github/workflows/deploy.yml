name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Mencegah deploy ganda berjalan bersamaan
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, zip, pdo, pdo_mysql, sqlite
          coverage: none

      - name: Create bootstrap/cache directory
        run: mkdir -p bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js for test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend assets (needed for PHPUnit views)
        run: |
          cp .env.example .env
          npm ci --no-audit --no-fund
          npm run build

      - name: Run PHPUnit
        run: php vendor/bin/phpunit

  build-assets:
    name: Build Frontend Assets (CI)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Create .env for build
        run: cp .env.example .env

      - name: Install NPM dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend assets
        run: npm run build

      - name: Verify manifest.json
        run: |
          if [ ! -s "public/build/manifest.json" ]; then
            echo "[ERROR] public/build/manifest.json tidak ditemukan atau kosong."
            exit 1
          fi
          echo "[OK] manifest.json valid ($(wc -c < public/build/manifest.json) bytes)."

      - name: Package build assets
        run: |
          # Buat ZIP dengan nama unik (untuk artifact traceability)
          SHA_ZIP="aplikasi-pelatihan-build-${{ github.sha }}.zip"
          # Buat juga dengan nama tetap (untuk release rolling — overwrite tiap deploy)
          RELEASE_ZIP="aplikasi-pelatihan-build.zip"
          zip -r "$SHA_ZIP" public/build
          cp "$SHA_ZIP" "$RELEASE_ZIP"
          echo "SHA_ZIP=$SHA_ZIP" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP=$RELEASE_ZIP" >> "$GITHUB_ENV"

      - name: Upload build artifact (with SHA, for traceability)
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-${{ github.sha }}
          path: aplikasi-pelatihan-build-${{ github.sha }}.zip
          retention-days: 7

      - name: Update rolling GitHub Release (latest-build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Frontend Build - ${{ github.sha }}"
          body: |
            Auto-built from commit `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - Build time: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          files: aplikasi-pelatihan-build.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-assets
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.DEPLOY_PATH }}"
            WEB_USER="${{ secrets.DEPLOY_WEB_USER || 'www-data' }}"
            WEB_GROUP="${{ secrets.DEPLOY_WEB_GROUP || 'www-data' }}"
            HEALTH_URL="${{ secrets.HEALTH_URL || 'https://pelatihanku.my.id' }}"
            GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            GITHUB_REPO="${{ github.repository }}"
            COMMIT_SHA="${{ github.sha }}"
            BUILD_ASSET_NAME="aplikasi-pelatihan-build.zip"
            DEPLOY_LOG="$APP_PATH/storage/logs/deploy-$(date +%Y%m%d_%H%M%S).log"
            MAINTENANCE_ACTIVE=false

            mkdir -p "$APP_PATH/storage/logs"

            log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$DEPLOY_LOG"; }
            die() { log "[ERROR] $1"; exit 1; }

            cleanup() {
              local exit_code=$?
              if [ "$MAINTENANCE_ACTIVE" = true ]; then
                log "[WARN] Cleanup: mematikan maintenance mode..."
                cd "$APP_PATH" && php artisan up || true
                log "[INFO] Maintenance mode OFF."
              fi
              exit $exit_code
            }
            trap cleanup EXIT

            cd "$APP_PATH" || die "Path tidak ditemukan: $APP_PATH"

            log "[INFO] =========================================="
            log "[INFO]  Auto Deploy - Aplikasi Pelatihan"
            log "[INFO]  Commit      : $COMMIT_SHA"
            log "[INFO]  Path        : $APP_PATH"
            log "[INFO]  Web user    : $WEB_USER:$WEB_GROUP"
            log "[INFO]  Health URL  : $HEALTH_URL"
            log "[INFO]  Log file    : $DEPLOY_LOG"
            log "[INFO] =========================================="

            # ============================================================
            # 1. Maintenance mode ON
            # ============================================================
            log "[1/10] Maintenance mode ON..."
            php artisan down --retry=60 --refresh=15 \
              || die "Gagal mengaktifkan maintenance mode."
            MAINTENANCE_ACTIVE=true

            # ============================================================
            # 2. Pull kode terbaru
            # ============================================================
            log "[2/10] Pull kode terbaru..."
            git pull origin main || die "Git pull gagal."

            # ============================================================
            # 3. Update Composer
            # ============================================================
            log "[3/10] Update Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction || die "Composer install gagal."

            # ============================================================
            # 4. Download pre-built frontend assets dari GitHub Release
            #    (tidak build di server — lebih cepat dan konsisten)
            # ============================================================
            log "[4/10] Download pre-built frontend assets..."

            BUILD_DOWNLOADED=false

            # Strategy 1: Download dari release dengan tag latest-build
            download_from_release() {
              local tag="latest-build"
              local url="https://github.com/$GITHUB_REPO/releases/download/$tag/$BUILD_ASSET_NAME"
              local temp_file="/tmp/$BUILD_ASSET_NAME"

              log "  Mencoba download: $url"

              if [ -n "$GITHUB_TOKEN" ]; then
                wget -q --timeout=120 --header="Authorization: token $GITHUB_TOKEN" -O "$temp_file" "$url" 2>/dev/null
              else
                wget -q --timeout=120 -O "$temp_file" "$url" 2>/dev/null
              fi

              if [ -f "$temp_file" ] && [ -s "$temp_file" ]; then
                log "  Download berhasil."
                rm -rf "$APP_PATH/public/build"
                unzip -o "$temp_file" -d "$APP_PATH" > /dev/null 2>&1 || {
                  log "  Gagal mengekstrak zip."
                  rm -f "$temp_file"
                  return 1
                }
                rm -f "$temp_file"
                BUILD_DOWNLOADED=true
                log "  public/build berhasil diperbarui dari release."
                return 0
              else
                log "  Download gagal (tag: $tag, asset: $BUILD_ASSET_NAME)."
                rm -f "$temp_file"
                return 1
              fi
            }

            # Strategy 2: Fallback — cari via GitHub API
            download_from_api_fallback() {
              log "  Fallback: cari via GitHub API..."
              local auth_header=""
              [ -n "$GITHUB_TOKEN" ] && auth_header="-H Authorization: token $GITHUB_TOKEN"

              # Coba dapatkan URL dari latest-build release
              local dl_url
              dl_url=$(curl -sL $auth_header \
                "https://api.github.com/repos/$GITHUB_REPO/releases/tags/latest-build" 2>/dev/null \
                | python3 -c "import sys,json; data=json.load(sys.stdin); assets=data.get('assets',[]); print(next((a['browser_download_url'] for a in assets if a['name']==sys.argv[1]),'') or next((a['browser_download_url'] for a in assets),''))" \
                "$BUILD_ASSET_NAME" 2>/dev/null || true)

              if [ -z "$dl_url" ]; then
                # Fallback ke latest release
                dl_url=$(curl -sL $auth_header \
                  "https://api.github.com/repos/$GITHUB_REPO/releases/latest" 2>/dev/null \
                  | python3 -c "import sys,json; data=json.load(sys.stdin); assets=data.get('assets',[]); print(next((a['browser_download_url'] for a in assets),''))" \
                  2>/dev/null || true)
              fi

              if [ -n "$dl_url" ]; then
                local temp_file="/tmp/$BUILD_ASSET_NAME"
                log "  Download dari: $dl_url"
                if wget -q --timeout=120 -O "$temp_file" "$dl_url" 2>/dev/null && [ -s "$temp_file" ]; then
                  rm -rf "$APP_PATH/public/build"
                  unzip -o "$temp_file" -d "$APP_PATH" > /dev/null 2>&1 || {
                    log "  Gagal mengekstrak zip fallback."
                    rm -f "$temp_file"
                    return 1
                  }
                  rm -f "$temp_file"
                  BUILD_DOWNLOADED=true
                  log "  public/build berhasil diperbarui dari fallback."
                  return 0
                fi
                rm -f "$temp_file"
              fi
              return 1
            }

            # Strategy 3: Build di server sebagai fallback terakhir
            build_on_server() {
              log "  Fallback terakhir: build di server..."
              if command -v node &> /dev/null && command -v npm &> /dev/null; then
                npm ci --no-audit --no-fund || die "NPM install gagal (fallback build)."
                npm run build || die "npm run build gagal (fallback build)."
                BUILD_DOWNLOADED=true
                log "  Build di server berhasil."
              else
                die "Node.js/npm tidak ditemukan di server. Tidak bisa build."
              fi
            }

            # Jalankan strategi berurutan
            download_from_release || download_from_api_fallback || build_on_server

            if [ "$BUILD_DOWNLOADED" != "true" ]; then
              die "Semua strategi build assets gagal."
            fi

            # ============================================================
            # 5. Verifikasi manifest.json
            # ============================================================
            log "[5/10] Verifikasi manifest.json..."
            if [ ! -f "public/build/manifest.json" ] || [ ! -s "public/build/manifest.json" ]; then
              die "public/build/manifest.json tidak ditemukan atau kosong. Halaman akan blank putih."
            fi

            # Validasi isi manifest: pastikan entry `resources/js/app.js` ada
            # (ganti heredoc Python multi-line dengan grep — sederhana & YAML-safe)
            if ! grep -q '"resources/js/app.js"' public/build/manifest.json 2>/dev/null; then
              die "Manifest.json tidak valid. Entry resources/js/app.js tidak ditemukan. Build assets mungkin outdated atau corrupt."
            fi
            log "[OK] manifest.json valid - entry resources/js/app.js ditemukan."

            # ============================================================
            # 6. Migrasi database
            # ============================================================
            log "[6/10] Migrasi database..."
            php artisan migrate --force || die "Migrasi database gagal."

            # ============================================================
            # 7. Storage link & optimize
            # ============================================================
            log "[7/10] Storage link & optimasi..."
            if [ ! -L "public/storage" ]; then
              php artisan storage:link || die "Gagal membuat storage symlink."
            fi
            php artisan config:cache || die "config:cache gagal."
            php artisan route:cache || die "route:cache gagal."
            php artisan view:cache || die "view:cache gagal."

            # ============================================================
            # 8. Permission
            # ============================================================
            log "[8/10] Set permission..."
            chmod -R 775 storage bootstrap/cache || die "Gagal set permission storage/cache."
            chmod 755 artisan || true
            if id "$WEB_USER" &>/dev/null; then
              chown -R "$WEB_USER":"$WEB_GROUP" storage bootstrap/cache public/build \
                || log "[WARN] chown gagal (mungkin butuh sudo)."
            else
              log "[WARN] User '$WEB_USER' tidak ditemukan."
            fi

            # 8b. Restart PHP-FPM (bersihkan opcache realpath)
            if command -v systemctl &> /dev/null && systemctl list-units --type=service | grep -q php.*-fpm; then
              log "[8b/10] Restart PHP-FPM..."
              sudo systemctl restart php*-fpm || log "[WARN] Gagal restart php-fpm."
            fi

            # ============================================================
            # 9. Health check
            # ============================================================
            log "[9/10] Health check ke $HEALTH_URL ..."
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$HEALTH_STATUS" = "200" ] || [ "$HEALTH_STATUS" = "302" ] || [ "$HEALTH_STATUS" = "301" ]; then
              log "[OK] Health check OK (HTTP $HEALTH_STATUS)."
            else
              log "[WARN] Health check tidak OK (HTTP $HEALTH_STATUS). Cek server/Nginx segera."
            fi

            # ============================================================
            # 10. Maintenance mode OFF
            # ============================================================
            log "[10/10] Maintenance mode OFF..."
            php artisan up || die "Gagal mematikan maintenance mode."
            MAINTENANCE_ACTIVE=false

            log "[OK] Deploy selesai: $(date)"
            log "[INFO] Commit: $COMMIT_SHA"
            log "[INFO] Log file: $DEPLOY_LOG"
