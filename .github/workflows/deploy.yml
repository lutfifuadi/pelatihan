name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Mencegah deploy ganda berjalan bersamaan
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, zip, pdo, pdo_mysql, sqlite
          coverage: none

      - name: Create bootstrap/cache directory
        run: mkdir -p bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js for test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend assets (needed for PHPUnit views)
        run: |
          cp .env.example .env
          npm cache clean --force
          npm ci --legacy-peer-deps
          npm run build

      - name: Run PHPUnit
        run: php vendor/bin/phpunit

  build-assets:
    name: Build Frontend Assets (CI)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Create .env for build
        run: cp .env.example .env

      - name: Install NPM dependencies
        run: |
          npm cache clean --force
          npm ci --legacy-peer-deps

      - name: Build frontend assets
        run: npm run build

      - name: Verify manifest.json
        run: |
          if [ ! -s "public/build/manifest.json" ]; then
            echo "[ERROR] public/build/manifest.json tidak ditemukan atau kosong."
            exit 1
          fi
          echo "[OK] manifest.json valid ($(wc -c < public/build/manifest.json) bytes)."

      - name: Package build assets
        run: |
          # Buat ZIP dengan nama unik (untuk artifact traceability)
          SHA_ZIP="aplikasi-pelatihan-build-${{ github.sha }}.zip"
          # Buat juga dengan nama tetap (untuk release rolling — overwrite tiap deploy)
          RELEASE_ZIP="aplikasi-pelatihan-build.zip"
          zip -r "$SHA_ZIP" public/build
          cp "$SHA_ZIP" "$RELEASE_ZIP"
          echo "SHA_ZIP=$SHA_ZIP" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP=$RELEASE_ZIP" >> "$GITHUB_ENV"

      - name: Upload build artifact (with SHA, for traceability)
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-${{ github.sha }}
          path: aplikasi-pelatihan-build-${{ github.sha }}.zip
          retention-days: 7

      - name: Update rolling GitHub Release (latest-build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Frontend Build - ${{ github.sha }}"
          body: |
            Auto-built from commit `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            - Commit: ${{ github.sha }}
            - Build time: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          files: aplikasi-pelatihan-build.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


