<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7367f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a3fcf;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" />
  <!-- Inner Circle (lighter) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />
  <!-- Letter P -->
  <text x="256" y="300" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="280" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central">P</text>
  <!-- Subtle highlight -->
  <ellipse cx="180" cy="160" rx="60" ry="40" fill="rgba(255,255,255,0.08)" transform="rotate(-30, 180, 160)" />
</svg>
